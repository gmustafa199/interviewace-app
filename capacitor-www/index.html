<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>InterviewAce</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F172A; color: #E2E8F0;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center; }
    .wrap { padding: 24px; }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex;
      align-items: center; justify-content: center; font-size: 34px; }
    h1 { font-size: 20px; margin: 0 0 8px; color: #F8FAFC; }
    p { font-size: 14px; color: #94A3B8; margin: 0 0 24px; line-height: 1.5; }
    button { background: #6366F1; color: white; border: 0; border-radius: 12px;
      padding: 14px 28px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">⚡</div>
    <h1>InterviewAce</h1>
    <p>Couldn't reach the server.<br />Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
